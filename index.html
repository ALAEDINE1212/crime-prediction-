<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Crime Prediction Project — Diagrams</title>

  <!-- Keep it modern, readable -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">C P</div>
      <div class="brandText">
        <div class="title">Crime Prediction Project</div>
        <div class="subtitle">Interactive Pipeline + ERD + Website Architecture (drag nodes • click for details)</div>
      </div>
    </div>

    <div class="controls">
      <div class="tabs" role="tablist" aria-label="Diagrams">
        <button class="tab active" data-diagram="pipeline" role="tab" aria-selected="true">Pipeline</button>
        <button class="tab" data-diagram="erd" role="tab" aria-selected="false">ERD</button>
        <button class="tab" data-diagram="web" role="tab" aria-selected="false">Website</button>
      </div>

      <div class="search">
        <input id="searchInput" type="text" placeholder="Search node (e.g., feature, ridge, api)..." />
        <button id="searchBtn">Find</button>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="panel graphPanel">
      <div class="panelHeader">
        <div>
          <div class="panelTitle" id="panelTitle">Pipeline Diagram</div>
          <div class="panelHint">Click node → details. Drag/zoom the graph. Positions persist.</div>
        </div>
        <div class="panelActions">
          <button id="fitBtn" class="btn">Fit</button>
        </div>
      </div>
      <div id="cy" class="cy"></div>
    </section>

    <aside class="panel detailsPanel">
      <div class="panelHeader">
        <div class="panelTitle">Node details</div>
        <div class="panelActions">
          <button id="resetLayoutBtn" class="btn">Reset layout</button>
          <button id="resetPosBtn" class="btn">Clear saved positions</button>
        </div>
      </div>

      <div id="details" class="detailsEmpty">
        <div class="emptyIcon">▣</div>
        <div class="emptyTitle">Click a node on the left.</div>
        <div class="emptySub">You’ll see what it does + how it links to the others.</div>
      </div>
    </aside>
  </main>

  <!-- Cytoscape + layout -->
  <script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
  <script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
  <script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>

  <script src="./app.js"></script>
</body>

</html>
