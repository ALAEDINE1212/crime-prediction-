<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Crime Prediction Project - Pipeline + ERD</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">CP</div>
      <div>
        <div class="title">Crime Prediction Project</div>
        <div class="subtitle">Interactive Pipeline + ERD (click nodes for clear explanations)</div>
      </div>
    </div>

    <div class="controls">
      <div class="tabs" role="tablist" aria-label="View">
        <button id="tabPipeline" class="tab active" role="tab" aria-selected="true">Pipeline</button>
        <button id="tabERD" class="tab" role="tab" aria-selected="false">ERD</button>
      </div>

      <div class="search">
        <input id="searchInput" type="text" placeholder="Search node (e.g., preprocessing, dim_cell)..." />
        <button id="btnFind" class="btn">Find</button>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="card left">
      <div class="cardHeader">
        <div class="cardTitle" id="graphTitle">Pipeline Diagram</div>
        <div class="hint">Click node → details. Drag/zoom the graph.</div>
      </div>
      <div id="graphHost" class="graphHost"></div>
    </section>

    <aside class="card right">
      <div class="cardHeader">
        <div class="cardTitle">Node details</div>
        <button id="btnReset" class="btn subtle">Reset</button>
      </div>

      <div id="details" class="details">
        <div class="detailsEmpty">
          <div class="emptyIcon"></div>
          <div class="emptyTitle">Click a node on the left.</div>
          <div class="emptyText">This panel explains what it is and how it connects.</div>
        </div>
      </div>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
