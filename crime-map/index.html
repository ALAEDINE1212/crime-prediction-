<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Crime Hotspot Map</title>

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
</head>

<body>
    <header class="topbar">
        <div class="brand">Crime Hotspot Prediction</div>

        <div class="controls">
            <label>
                Forecast month
                <select id="monthSelect"></select>
            </label>

            <label>
                Top %
                <input id="topPct" type="number" min="0.01" max="0.50" step="0.01" value="0.05" />
            </label>

            <label class="checkbox">
                <input id="useBbox" type="checkbox" checked />
                Only current map view
            </label>

            <button id="btnLoad">Load hotspots</button>
            <span id="status" class="status"></span>
        </div>
    </header>

    <main class="layout">
        <div id="map"></div>

        <aside class="panel">
            <h2>Click on the map</h2>
            <p>This queries the nearest grid cell prediction for the selected forecast month.</p>
            <pre id="clickInfo" class="box">No click yet.</pre>

            <h2>Legend</h2>
            <div class="legend">
                <div><span class="dot"></span> Predicted hotspot (top K)</div>
            </div>

            <h2>Notes</h2>
            <ul>
                <li>Monthly one-step-ahead predictions.</li>
                <li>Hotspots = top predicted cells.</li>
            </ul>
        </aside>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="app.js"></script>
</body>

</html>
